<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VivaGraph: real graphs</title>
<link rel="icon" href="data:,">
<style>
  /* The canvas color, so the page does not flash before the first frame */
  html {background: #0e1624}
  #about {position: fixed; left: 12px; top: 12px; max-width: min(26em, calc(100vw - 24px)); font: 13px/1.45 system-ui, sans-serif; color: #e6ebf2}
  #about select {font: inherit; color: inherit; background: #151e2d; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 6px; padding: 4px 6px; max-width: 100%}
  #about p {margin: 8px 0 0; color: #a9b4c4}
  #about a {color: inherit}
</style>
</head>
<body>
<div id="about">
  <select id="pick" aria-label="Graph"></select>
  <p id="text">Loading…</p>
  <p id="credit"></p>
</div>
<script src="../dist/vivagraph.min.js"></script>
<script>
  // Each graph is a file in data/. The page loads them with fetch, so it has to come from a web
  // server (`npx serve`, for one) and not straight from the disk.
  const GRAPHS = {
    'london-underground': 'London Underground',
    'influence': 'Who influenced whom (6,000 people)',
    'royal-houses': 'Royal houses of Europe',
    'greek-mythology': 'Greek mythology',
    'programming-languages': 'Programming languages',
    'nobel-advisors': 'Nobel laureates and their teachers',
    'air-routes': 'Air routes',
    'constellations': 'Constellations',
    'muscles-and-bones': 'Muscles and bones',
    'burgess-shale': 'Burgess Shale food web',
    'miserables': 'Les Misérables',
    'word-ladders': 'Word ladders',
    'countries': 'Countries and their borders',
    'us-counties': 'US counties',
    'wordnet-mammals': 'Mammals (WordNet)',
    'chess-openings': 'Chess openings',
    'languages': 'Languages of the world (13,000 nodes)',
    'world-metros': 'Metros of the world (16,000 nodes)',
    'wordnet-nouns': 'English nouns (74,000 nodes, best on WebGPU)'
  };
  const pick = document.getElementById('pick');
  for (const key in GRAPHS) pick.add(new Option(GRAPHS[key], key));
  // Picking a graph changes the address, so every graph has a link and Back goes to the last one
  pick.onchange = () => { history.pushState(null, '', '?graph=' + pick.value); show(); };
  window.onpopstate = show;

  let viva = null, turn = 0;
  show();

  // Draws the graph that the address names, in place of the one on screen
  function show() {
    const asked = new URLSearchParams(location.search).get('graph');
    const name = Object.hasOwn(GRAPHS, asked) ? asked : 'london-underground';
    const mine = ++turn;
    pick.value = name;
    document.getElementById('text').textContent = 'Loading…';
    document.getElementById('credit').textContent = '';

    fetch(`data/${name}.json`).then(response => response.json()).then(file => {
      if (mine !== turn) return;  // another graph was picked while this one was on its way
      const graph = toGraph(file);

      // The file says which field colors the nodes and which one puts the important names first
      const style = {};
      if (file.colorBy) style.colorBy = file.colorBy;
      if (file.palette) style.palette = file.palette;
      if (file.linkData && file.linkColors) style.linkColors = file.linkColors;
      if (viva) viva.dispose();
      viva = Viva.render(graph, {style, labels: file.importance ? {importance: file.importance} : true});

      const count = n => n.toLocaleString('en-US');
      document.getElementById('text').textContent =
        `${file.about} ${count(graph.getNodesCount())} nodes, ${count(graph.getLinksCount())} links.`;
      credit(document.getElementById('credit'), `Data: ${file.source}. ${file.license}.`);
    }).catch(error => {
      if (mine === turn) document.getElementById('text').textContent = `Could not load the graph (${error.message}).`;
    });
  }

  // A file is {fields, nodes: [[...fields]], links: [from, to, from, to, ...], linkData?} and a few
  // words about itself. A node's row holds `fields` in order: "id" is its id (the row number when
  // there is none), and the rest becomes node.data, which labels, tooltips and search read.
  function toGraph(file) {
    const graph = Viva.createGraph();
    const idAt = file.fields.indexOf('id');
    const ids = file.nodes.map((row, i) => {
      const data = {};
      file.fields.forEach((field, k) => {
        if (k === idAt || row[k] === null || row[k] === undefined) return;
        // Fields that start with "_" color the nodes, but tooltips don't list them
        if (field[0] === '_') Object.defineProperty(data, field, {value: row[k]});
        else data[field] = row[k];
      });
      const id = idAt < 0 ? i : row[idAt];
      graph.addNode(id, data);
      return id;
    });
    for (let i = 0; i + 1 < file.links.length; i += 2) {
      graph.addLink(ids[file.links[i]], ids[file.links[i + 1]], file.linkData ? file.linkData[i / 2] : undefined);
    }
    return graph;
  }

  // Text with its web addresses as links
  function credit(element, text) {
    text.split(/(https?:\/\/[^\s),]*[^\s),.])/).forEach((part, i) => {
      if (i % 2 === 0) { element.append(part); return; }
      const link = element.appendChild(document.createElement('a'));
      link.href = part;
      link.textContent = part.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '');
    });
  }
</script>
</body>
</html>
